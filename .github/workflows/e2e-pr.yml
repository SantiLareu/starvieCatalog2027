name: E2E pull request

# Verificación de los Playwright E2E para cada PR hacia main.
# NO publica nada: no hay permisos de escritura, ni `pages`, ni entorno de
# despliegue, ni servidor de vista previa. El workflow de Pages (.github/
# workflows/deploy.yml) es otro archivo y no se toca.

# "on" va entre comillas para que los analizadores YAML 1.1 (PyYAML) lo lean
# como la clave y no como el booleano `true`.
"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: e2e-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (canales comerciales)
    runs-on: ubuntu-latest
    # Suite amplia (47 archivos): 45 min es un techo acotado pero holgado.
    timeout-minutes: 60
    env:
      # Extremos INERTES: en 127.0.0.1:8099 no escucha nadie, así que toda
      # petición NO simulada falla localmente y nunca sale a la red. Las bases
      # conservan las rutas canónicas (/api/orders, /api/distributor/*) para
      # que los mocks de los E2E las intercepten.
      VITE_API_BASE_URL: http://127.0.0.1:8099
      VITE_DISTRIBUTOR_API_BASE_URL: http://127.0.0.1:8099
      # Sin Turnstile: el widget no se monta y no se pide ningún token.
      VITE_TURNSTILE_ENABLED: "false"
      VITE_TURNSTILE_SITE_KEY: ""
      # El informe HTML no debe abrir un servidor al fallar (bloquearía el job).
      PLAYWRIGHT_HTML_OPEN: "never"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # PR en desarrollo: sólo las pruebas COMERCIALES (canales público y
      # distribuidor: login, precios, carrito, checkout, logout y aislamiento).
      - name: Run E2E (canales comerciales)
        if: github.event.action != 'ready_for_review'
        run: >-
          npx playwright test
          e2e/commerce.spec.ts
          e2e/checkout-image.spec.ts
          e2e/checkout-reconciliation.spec.ts
          e2e/checkout-success.spec.ts
          e2e/distributor-flow.spec.ts
          e2e/distributor-refinement.spec.ts
          --workers=2 --reporter=list,html

      # Revisión final: al pasar el PR de Draft a Ready for review corre la
      # suite E2E COMPLETA. Bloquea: una regresión en un spec no comercial
      # debe poder fallar el CI, con sus fallos a la vista en el log y el
      # artifact.
      - name: Run E2E (suite completa)
        if: github.event.action == 'ready_for_review'
        run: npx playwright test --workers=2 --reporter=list,html

      - name: Upload Playwright report (comercial)
        if: always() && github.event.action != 'ready_for_review'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report (suite completa)
        if: always() && github.event.action == 'ready_for_review'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-suite-completa
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
