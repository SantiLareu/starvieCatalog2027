name: E2E pull request

# Verificación de los Playwright E2E para cada PR hacia main.
# NO publica nada: no hay permisos de escritura, ni `pages`, ni entorno de
# despliegue, ni servidor de vista previa. El workflow de Pages (.github/
# workflows/deploy.yml) es otro archivo y no se toca.

# "on" va entre comillas para que los analizadores YAML 1.1 (PyYAML) lo lean
# como la clave y no como el booleano `true`.
"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: e2e-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Suite amplia (47 archivos): 45 min es un techo acotado pero holgado.
    timeout-minutes: 45
    env:
      # Extremos INERTES: en 127.0.0.1:9 no escucha nadie, así que toda
      # petición NO simulada falla localmente y nunca sale a la red. Ni el
      # pedido público ni el de distribuidores pueden alcanzar una API real.
      VITE_API_BASE_URL: http://127.0.0.1:9/api-inert
      VITE_DISTRIBUTOR_API_BASE_URL: http://127.0.0.1:9/api-inert
      # Sin Turnstile: el widget no se monta y no se pide ningún token.
      VITE_TURNSTILE_ENABLED: "false"
      VITE_TURNSTILE_SITE_KEY: ""
      # El informe HTML no debe abrir un servidor al fallar (bloquearía el job).
      PLAYWRIGHT_HTML_OPEN: "never"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npx playwright test --workers=2 --reporter=list,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
